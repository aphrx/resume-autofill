<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 500px;
        margin: 0;
        padding: 10px;
        box-sizing: border-box;
        font-family: sans-serif;
      }
      textarea {
        width: 100%;
        height: 300px;
        box-sizing: border-box;
        font-family: monospace;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 10px;
        font-size: 16px;
      }
      .tab-buttons {
        display: flex;
        border-bottom: 2px solid #ddd;
        margin-bottom: 10px;
      }
      .tab-button {
        flex: 1;
        padding: 10px;
        text-align: center;
        cursor: pointer;
        background-color: #f4f4f4;
        border: 1px solid #ddd;
        border-bottom: none;
      }
      .tab-button.active {
        background-color: #fff;
        font-weight: bold;
        border-bottom: 2px solid #fff;
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
      .field-container {
        margin-bottom: 10px;
      }
      .field-container label {
        font-weight: bold;
        display: block;
        margin-bottom: 4px;
      }
      .field-container input {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h3>Resume Parser</h3>

    <div class="tab-buttons">
      <div class="tab-button active" data-tab="tabResume">Resume</div>
      <div class="tab-button" data-tab="tabDetails">Details</div>
    </div>

    <div id="tabResume" class="tab-content active">
      <textarea id="resumeText" placeholder="Paste your resume here..."></textarea>
      <button id="saveResume">Save Resume</button>
    </div>

    <div id="tabDetails" class="tab-content">
      <div class="field-container">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" />
      </div>
      <div class="field-container">
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" />
      </div>
      <div class="field-container">
        <label for="email">Email:</label>
        <input type="text" id="email" />
      </div>
      <div class="field-container">
        <label for="phone">Phone:</label>
        <input type="text" id="phone" />
      </div>
      <div class="field-container">
        <label for="summary">Summary:</label>
        <input type="text" id="summary" />
      </div>
      <button id="updateDetailsButton">Update Details</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
